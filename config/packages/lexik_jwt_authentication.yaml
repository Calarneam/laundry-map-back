lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600

    set_cookies:
      BEARER:
        name: 'BEARER'
        lifetime: null # Utilise le token_ttl par défaut
        path: /
        domain: null
        secure: true 
        httpOnly: true

    token_extractors:
      cookie:
        name: 'BEARER'
      
      authorization_header:
        prefix: 'Bearer'
        name: 'Authorization'

